[project]
name = "advnet-decision"
version = "0.1.0"
description = "LLM-only closed-loop experiments for the cEOS Abilene testbed"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
batfish = ["pybatfish"]
live = ["typesafe-sdk>=0.7.5,<0.8", "openai>=2,<3", "anthropic>=0.70,<1"]

[tool.setuptools.packages.find]
include = ["advnet*"]

[tool.setuptools.package-data]
advnet = ["web/*.html", "web/*.css", "web/*.js"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
