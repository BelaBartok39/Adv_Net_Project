hostname sea
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.41/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-sva
   no switchport
   ip address 10.65.0.1/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet2
   description to-den
   no switchport
   ip address 10.65.0.5/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet3
   description to-h-sea
   no switchport
   ip address 10.64.1.1/24
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 10.255.0.1
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
!
end
