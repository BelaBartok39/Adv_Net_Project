hostname kcy
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.45/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-den
   no switchport
   ip address 10.65.0.22/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet2
   description to-hou
   no switchport
   ip address 10.65.0.25/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet3
   description to-ind
   no switchport
   ip address 10.65.0.29/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet4
   description to-h-kcy
   no switchport
   ip address 10.64.5.1/24
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 10.255.0.5
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   no passive-interface Ethernet3
!
end
