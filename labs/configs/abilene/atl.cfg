hostname atl
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.47/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-hou
   no switchport
   ip address 10.65.0.34/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet2
   description to-was
   no switchport
   ip address 10.65.0.37/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet3
   description to-ind
   no switchport
   ip address 10.65.0.41/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet4
   description to-h-atl
   no switchport
   ip address 10.64.7.1/24
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 10.255.0.7
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   no passive-interface Ethernet3
!
end
