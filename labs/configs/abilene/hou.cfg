hostname hou
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.46/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-lax
   no switchport
   ip address 10.65.0.18/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet2
   description to-kcy
   no switchport
   ip address 10.65.0.26/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet3
   description to-atl
   no switchport
   ip address 10.65.0.33/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet4
   description to-h-hou
   no switchport
   ip address 10.64.6.1/24
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 10.255.0.6
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
   no passive-interface Ethernet3
!
end
