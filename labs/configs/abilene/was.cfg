hostname was
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.50/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-atl
   no switchport
   ip address 10.65.0.38/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet2
   description to-nyc
   no switchport
   ip address 10.65.0.53/30
   ip ospf area 0.0.0.0
   ip ospf network point-to-point
   ip ospf cost 10
   no shutdown
!
interface Ethernet3
   description to-h-was
   no switchport
   ip address 10.64.10.1/24
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 10.255.0.10
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
!
end
