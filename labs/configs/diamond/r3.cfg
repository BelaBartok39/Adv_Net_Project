! Arista EOS baseline for the four-router diamond
hostname r3
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.13/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-r1
   no switchport
   ip address 10.0.13.2/30
   ip ospf area 0.0.0.0
   no shutdown
   ip ospf network point-to-point
   ip ospf cost 100
!
interface Ethernet2
   description to-r4
   no switchport
   ip address 10.0.34.1/30
   ip ospf area 0.0.0.0
   no shutdown
   ip ospf network point-to-point
   ip ospf cost 100
!
router ospf 1
   router-id 3.3.3.3
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
!
end
