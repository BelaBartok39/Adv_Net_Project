! Arista EOS baseline for the four-router diamond
hostname r1
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.30.100.11/24
   no shutdown
!
ip routing
ip route vrf MGMT 0.0.0.0/0 172.30.100.1
!
interface Ethernet1
   description to-r2
   no switchport
   ip address 10.0.12.1/30
   ip ospf area 0.0.0.0
   no shutdown
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description to-r3
   no switchport
   ip address 10.0.13.1/30
   ip ospf area 0.0.0.0
   no shutdown
   ip ospf network point-to-point
   ip ospf cost 100
!
interface Ethernet3
   description to-host-a
   no switchport
   ip address 10.10.1.1/24
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 1.1.1.1
   passive-interface default
   no passive-interface Ethernet1
   no passive-interface Ethernet2
!
end
